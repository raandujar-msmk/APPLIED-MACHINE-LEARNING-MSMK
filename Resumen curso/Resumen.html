<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applied Machine Learning - MSMK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .animate-fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom Scrollbar for the content area */
        .custom-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #c7c7c7; 
            border-radius: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8; 
        }
    </style>
</head>
<body class="h-screen flex overflow-hidden bg-gray-50 text-gray-800">

    <!-- Sidebar Navigation -->
    <aside class="w-20 lg:w-64 bg-slate-900 text-white flex flex-col flex-shrink-0 transition-all duration-300">
        <div class="p-4 lg:p-6 flex items-center justify-center lg:justify-start border-b border-slate-700">
            <i class="fa-solid fa-brain text-2xl lg:text-3xl text-blue-400"></i>
            <span class="ml-3 font-bold text-xl hidden lg:block">MSMK AI</span>
        </div>
        
        <nav class="flex-1 overflow-y-auto py-4 custom-scroll">
            <ul class="space-y-1 px-2">
                <!-- Navigation Items generated by JS -->
                <div id="nav-items-container"></div>
            </ul>
        </nav>

        <div class="p-4 border-t border-slate-700">
            <a href="https://github.com/raandujar-msmk/APPLIED-MACHINE-LEARNING-MSMK" target="_blank" class="flex items-center justify-center lg:justify-start p-2 rounded-lg hover:bg-slate-800 transition-colors">
                <i class="fa-brands fa-github text-xl"></i>
                <span class="ml-3 hidden lg:block text-sm">Ver Repositorio</span>
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden relative">
        
        <!-- Header -->
        <header class="bg-white shadow-sm z-10 p-4 lg:px-8 flex justify-between items-center h-16">
            <h1 class="text-xl font-bold text-slate-800 truncate" id="header-title">Resumen del Curso</h1>
            
            <div class="flex items-center space-x-4">
                <div class="hidden md:flex flex-col items-end mr-2">
                    <span class="text-xs text-gray-500 uppercase tracking-wider font-semibold">Tu Progreso</span>
                    <div class="w-32 bg-gray-200 rounded-full h-2 mt-1">
                        <div id="global-progress-bar" class="bg-blue-600 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>
                <div class="h-8 w-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold border border-blue-200">
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>
        </header>

        <!-- Dynamic Content Area -->
        <div id="content-area" class="flex-1 overflow-y-auto p-4 lg:p-8 custom-scroll relative">
            <!-- Content will be injected here -->
        </div>

    </main>

    <!-- Javascript Logic -->
    <script>
        // Course Data derived from the repository structure
        const courseData = [
            {
                id: 1,
                title: "Introducción",
                folder: "Sesion 1- Introduccion",
                icon: "fa-flag-checkered",
                color: "text-emerald-500",
                bg: "bg-emerald-100",
                desc: "Fundamentos de Machine Learning, configuración del entorno (Python, Jupyter, Anaconda) y repaso de bibliotecas esenciales como NumPy y Pandas.",
                topics: ["Qué es Machine Learning", "Tipos de ML", "Setup del Entorno", "Intro a Pandas/NumPy"]
            },
            {
                id: 2,
                title: "Unsupervised Learning",
                folder: "Sesion 2 - Unsupervised Learning",
                icon: "fa-layer-group",
                color: "text-purple-500",
                bg: "bg-purple-100",
                desc: "Algoritmos para encontrar patrones en datos no etiquetados. Clustering y reducción de dimensionalidad.",
                topics: ["K-Means Clustering", "Hierarchical Clustering", "DBSCAN", "PCA (Principal Component Analysis)"]
            },
            {
                id: 3,
                title: "Supervised Learning",
                folder: "Sesion 3 - Supervised Learning",
                icon: "fa-chart-line",
                color: "text-blue-500",
                bg: "bg-blue-100",
                desc: "Predicción basada en datos etiquetados. Modelos de regresión y clasificación.",
                topics: ["Regresión Lineal y Logística", "Árboles de Decisión", "Random Forest", "SVM (Support Vector Machines)", "Métricas de Evaluación"]
            },
            {
                id: 4,
                title: "Deep Learning",
                folder: "Sesion 4 - Deep learning",
                icon: "fa-network-wired",
                color: "text-red-500",
                bg: "bg-red-100",
                desc: "Introducción a las redes neuronales artificiales y frameworks de Deep Learning.",
                topics: ["Perceptrón Multicapa", "Backpropagation", "Funciones de Activación", "Keras & TensorFlow Basics"]
            },
            {
                id: 5,
                title: "Reinforcement Learning",
                folder: "Sesion 5 - Reinforcement Learning",
                icon: "fa-robot",
                color: "text-orange-500",
                bg: "bg-orange-100",
                desc: "Agentes que aprenden a tomar decisiones a través de prueba y error en un entorno.",
                topics: ["Conceptos de Agente/Entorno", "Recompensas (Rewards)", "Q-Learning", "Exploración vs Explotación"]
            },
            {
                id: 6,
                title: "Computer Vision",
                folder: "Sesion 6 - Computer Vision y OpenCV",
                icon: "fa-eye",
                color: "text-indigo-500",
                bg: "bg-indigo-100",
                desc: "Procesamiento y análisis de imágenes y video para que las máquinas puedan 'ver'.",
                topics: ["OpenCV Básico", "Procesamiento de Imágenes", "Detección de Objetos", "CNNs (Convolutional Neural Networks)"]
            },
            {
                id: 7,
                title: "LLMs",
                folder: "Sesion 7 - LLMs",
                icon: "fa-comments",
                color: "text-teal-500",
                bg: "bg-teal-100",
                desc: "Large Language Models y Procesamiento del Lenguaje Natural moderno.",
                topics: ["Transformers Architecture", "Hugging Face", "Prompt Engineering", "Fine-tuning básico"]
            },
            {
                id: 8,
                title: "Causal ML",
                folder: "Sesion 8 - Causal Machine Learning",
                icon: "fa-project-diagram",
                color: "text-pink-500",
                bg: "bg-pink-100",
                desc: "Diferenciar correlación de causalidad para tomar decisiones de negocio efectivas.",
                topics: ["Inferencia Causal", "Contrafactuales", "Uplift Modeling", "Do-calculus intro"]
            },
            {
                id: 9,
                title: "PaaS y Containerización",
                folder: "Session 9 - PaaS y containerización",
                icon: "fa-box-open",
                color: "text-cyan-500",
                bg: "bg-cyan-100",
                desc: "Despliegue de modelos en producción utilizando contenedores y la nube.",
                topics: ["Docker", "Kubernetes Basics", "Cloud Platforms (AWS/GCP/Azure)", "Model Serving"]
            },
            {
                id: 10,
                title: "Visualización",
                folder: "Sesion 10 - Visualizacion y Storytelling",
                icon: "fa-chart-pie",
                color: "text-yellow-500",
                bg: "bg-yellow-100",
                desc: "Comunicar los resultados de los datos de manera efectiva mediante historias visuales.",
                topics: ["Matplotlib & Seaborn", "Principios de Diseño", "Data Storytelling", "Dashboards Interactivos"]
            }
        ];

        // State
        let activeSessionId = null; // null means 'Home' view
        let completedSessions = new Set();

        // DOM Elements
        const navContainer = document.getElementById('nav-items-container');
        const contentArea = document.getElementById('content-area');
        const headerTitle = document.getElementById('header-title');
        const progressBar = document.getElementById('global-progress-bar');

        // Initialize
        function init() {
            renderSidebar();
            renderHome();
            loadProgress();
        }

        // Render Sidebar
        function renderSidebar() {
            navContainer.innerHTML = '';
            
            // Home button
            const homeBtn = document.createElement('li');
            homeBtn.innerHTML = `
                <button onclick="renderHome()" class="w-full flex items-center p-3 rounded-lg hover:bg-slate-800 transition-colors ${activeSessionId === null ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-300'}">
                    <i class="fa-solid fa-home w-6 text-center"></i>
                    <span class="ml-3 hidden lg:block font-medium">Inicio</span>
                </button>
            `;
            navContainer.appendChild(homeBtn);

            // Divider
            const divider = document.createElement('div');
            divider.className = "my-4 border-t border-slate-700 mx-2";
            navContainer.appendChild(divider);

            // Session buttons
            courseData.forEach(session => {
                const li = document.createElement('li');
                li.className = "mb-1";
                const isActive = activeSessionId === session.id;
                const isCompleted = completedSessions.has(session.id);
                
                li.innerHTML = `
                    <button onclick="renderSession(${session.id})" class="group w-full flex items-center p-3 rounded-lg hover:bg-slate-800 transition-all ${isActive ? 'bg-slate-800 text-white border-l-4 border-blue-500' : 'text-slate-400'}">
                        <div class="relative w-6 text-center">
                            <i class="fa-solid ${session.icon} ${isActive ? 'text-blue-400' : ''}"></i>
                            ${isCompleted ? '<span class="absolute -top-1 -right-1 h-2 w-2 bg-green-500 rounded-full border border-slate-900"></span>' : ''}
                        </div>
                        <span class="ml-3 hidden lg:block text-sm font-medium truncate group-hover:text-white transition-colors">${session.title}</span>
                    </button>
                `;
                navContainer.appendChild(li);
            });
        }

        // Render Home View (Dashboard)
        function renderHome() {
            activeSessionId = null;
            headerTitle.innerText = "Resumen del Curso - Applied Machine Learning";
            renderSidebar();

            const completedCount = completedSessions.size;
            const totalCount = courseData.length;
            const percentage = Math.round((completedCount / totalCount) * 100);

            let html = `
                <div class="animate-fade-in max-w-6xl mx-auto">
                    <!-- Hero Section -->
                    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-2xl p-8 mb-8 text-white shadow-xl relative overflow-hidden">
                        <div class="absolute top-0 right-0 opacity-10 transform translate-x-10 -translate-y-10">
                            <i class="fa-solid fa-brain text-9xl"></i>
                        </div>
                        <div class="relative z-10">
                            <h2 class="text-3xl font-bold mb-2">Bienvenido al Curso</h2>
                            <p class="text-blue-100 max-w-2xl text-lg">Explora el repositorio de MSMK sobre Machine Learning Aplicado. Desde los fundamentos hasta LLMs y Cloud Deployment.</p>
                            
                            <div class="mt-6 flex items-center space-x-4">
                                <div class="bg-white/20 backdrop-blur-sm rounded-lg p-3 px-5">
                                    <span class="block text-2xl font-bold">${totalCount}</span>
                                    <span class="text-xs text-blue-100 uppercase">Módulos</span>
                                </div>
                                <div class="bg-white/20 backdrop-blur-sm rounded-lg p-3 px-5">
                                    <span class="block text-2xl font-bold">${percentage}%</span>
                                    <span class="text-xs text-blue-100 uppercase">Completado</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Grid of Sessions -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-10">
            `;

            courseData.forEach(session => {
                const isCompleted = completedSessions.has(session.id);
                html += `
                    <div onclick="renderSession(${session.id})" class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 cursor-pointer card-hover transition-all duration-300 group relative overflow-hidden">
                        ${isCompleted ? '<div class="absolute top-0 right-0 bg-green-500 text-white text-xs font-bold px-2 py-1 rounded-bl-lg"><i class="fa-solid fa-check mr-1"></i> Hecho</div>' : ''}
                        
                        <div class="flex items-center justify-between mb-4">
                            <div class="h-12 w-12 rounded-full ${session.bg} ${session.color} flex items-center justify-center text-xl">
                                <i class="fa-solid ${session.icon}"></i>
                            </div>
                            <span class="text-xs font-semibold text-gray-400">SESIÓN ${session.id}</span>
                        </div>
                        
                        <h3 class="text-lg font-bold text-gray-800 mb-2 group-hover:text-blue-600 transition-colors">${session.title}</h3>
                        <p class="text-sm text-gray-500 line-clamp-2 mb-4">${session.desc}</p>
                        
                        <div class="flex flex-wrap gap-2">
                            ${session.topics.slice(0, 2).map(t => `<span class="bg-gray-100 text-gray-600 text-xs px-2 py-1 rounded-md">${t}</span>`).join('')}
                            ${session.topics.length > 2 ? `<span class="bg-gray-50 text-gray-400 text-xs px-2 py-1 rounded-md">+${session.topics.length - 2}</span>` : ''}
                        </div>
                    </div>
                `;
            });

            html += `
                    </div>
                </div>
            `;
            
            contentArea.innerHTML = html;
        }

        // Render Individual Session Detail
        function renderSession(id) {
            activeSessionId = id;
            const session = courseData.find(s => s.id === id);
            headerTitle.innerText = `Sesión ${id}: ${session.title}`;
            renderSidebar();

            const isCompleted = completedSessions.has(session.id);

            contentArea.innerHTML = `
                <div class="animate-fade-in max-w-5xl mx-auto pb-10">
                    
                    <!-- Top Actions -->
                    <div class="flex justify-between items-center mb-6">
                        <button onclick="renderHome()" class="text-gray-500 hover:text-gray-800 font-medium flex items-center transition-colors">
                            <i class="fa-solid fa-arrow-left mr-2"></i> Volver al panel
                        </button>
                        
                        <button onclick="toggleComplete(${session.id})" class="flex items-center px-4 py-2 rounded-lg font-bold shadow-sm transition-all ${isCompleted ? 'bg-green-100 text-green-700 hover:bg-green-200' : 'bg-white text-gray-600 border border-gray-200 hover:border-blue-500 hover:text-blue-600'}">
                            <i class="fa-solid ${isCompleted ? 'fa-check-circle' : 'fa-circle-check'} mr-2"></i>
                            ${isCompleted ? 'Completado' : 'Marcar como Completado'}
                        </button>
                    </div>

                    <!-- Header Banner -->
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-8">
                        <div class="h-24 ${session.bg} w-full relative">
                            <div class="absolute -bottom-10 left-8">
                                <div class="h-20 w-20 rounded-xl bg-white shadow-md flex items-center justify-center text-4xl ${session.color}">
                                    <i class="fa-solid ${session.icon}"></i>
                                </div>
                            </div>
                        </div>
                        <div class="pt-12 px-8 pb-8">
                            <h2 class="text-3xl font-bold text-gray-800 mb-2">${session.title}</h2>
                            <p class="text-gray-600 text-lg leading-relaxed">${session.desc}</p>
                        </div>
                    </div>

                    <!-- Content Grid -->
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        
                        <!-- Left Column: Syllabus & Details -->
                        <div class="lg:col-span-2 space-y-6">
                            
                            <!-- Topics Card -->
                            <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
                                <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center">
                                    <i class="fa-solid fa-list-ul mr-2 text-blue-500"></i>
                                    Temario de la Sesión
                                </h3>
                                <ul class="space-y-3">
                                    ${session.topics.map(topic => `
                                        <li class="flex items-start">
                                            <i class="fa-solid fa-check text-green-500 mt-1 mr-3 text-xs"></i>
                                            <span class="text-gray-700">${topic}</span>
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>

                            <!-- Mock Code Preview -->
                            <div class="bg-slate-900 rounded-xl shadow-lg overflow-hidden text-gray-300 font-mono text-sm border border-slate-700">
                                <div class="bg-slate-800 p-3 border-b border-slate-700 flex items-center">
                                    <div class="flex space-x-2 mr-4">
                                        <div class="w-3 h-3 rounded-full bg-red-500"></div>
                                        <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                                        <div class="w-3 h-3 rounded-full bg-green-500"></div>
                                    </div>
                                    <span class="text-xs text-gray-400">ejemplo_codigo.py</span>
                                </div>
                                <div class="p-4 overflow-x-auto">
                                    <pre><code><span class="text-purple-400">import</span> pandas <span class="text-purple-400">as</span> pd
<span class="text-purple-400">from</span> sklearn.model_selection <span class="text-purple-400">import</span> train_test_split
<span class="text-purple-400">from</span> .${session.title.toLowerCase().replace(/ /g,'_')} <span class="text-purple-400">import</span> Model

<span class="text-gray-500"># Cargar dataset</span>
df = pd.read_csv(<span class="text-green-400">"data_sesion_${session.id}.csv"</span>)
X = df.drop(<span class="text-green-400">"target"</span>, axis=1)
y = df[<span class="text-green-400">"target"</span>]

<span class="text-gray-500"># Entrenar modelo</span>
model = Model()
model.fit(X, y)

print(<span class="text-green-400">f"Model Accuracy: {model.score(X,y)}"</span>)</code></pre>
                                </div>
                            </div>

                        </div>

                        <!-- Right Column: Resources & Links -->
                        <div class="space-y-6">
                            
                            <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
                                <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-4">Recursos del Repositorio</h3>
                                <a href="https://github.com/raandujar-msmk/APPLIED-MACHINE-LEARNING-MSMK/tree/main/${encodeURIComponent(session.folder)}" target="_blank" class="block w-full bg-gray-50 hover:bg-blue-50 hover:border-blue-200 border border-gray-200 rounded-lg p-4 transition-all group mb-3">
                                    <div class="flex items-center justify-between mb-1">
                                        <span class="font-semibold text-gray-700 group-hover:text-blue-700">Abrir Carpeta</span>
                                        <i class="fa-solid fa-external-link-alt text-gray-400 group-hover:text-blue-500"></i>
                                    </div>
                                    <p class="text-xs text-gray-500">Accede a los notebooks y datasets de esta sesión.</p>
                                </a>

                                <div class="mt-6 pt-6 border-t border-gray-100">
                                    <h4 class="text-xs font-bold text-gray-800 mb-2">Archivos típicos:</h4>
                                    <div class="space-y-2">
                                        <div class="flex items-center text-sm text-gray-600">
                                            <i class="fa-solid fa-book-open text-orange-400 mr-2 w-4"></i> notebook.ipynb
                                        </div>
                                        <div class="flex items-center text-sm text-gray-600">
                                            <i class="fa-solid fa-database text-blue-400 mr-2 w-4"></i> dataset.csv
                                        </div>
                                        <div class="flex items-center text-sm text-gray-600">
                                            <i class="fa-solid fa-file-pdf text-red-400 mr-2 w-4"></i> slides.pdf
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="bg-blue-600 rounded-xl shadow-lg p-6 text-white relative overflow-hidden">
                                <div class="relative z-10">
                                    <h3 class="font-bold text-lg mb-2">¿Necesitas ayuda?</h3>
                                    <p class="text-blue-100 text-sm mb-4">Revisa las 'issues' del repositorio si tienes problemas con el código.</p>
                                    <a href="https://github.com/raandujar-msmk/APPLIED-MACHINE-LEARNING-MSMK/issues" target="_blank" class="inline-block bg-white text-blue-600 text-xs font-bold px-4 py-2 rounded-lg hover:bg-blue-50 transition-colors">
                                        Ver Issues
                                    </a>
                                </div>
                                <i class="fa-solid fa-question-circle absolute -bottom-4 -right-4 text-8xl text-blue-500 opacity-50"></i>
                            </div>

                        </div>
                    </div>

                </div>
            `;
        }

        // Toggle Complete Status
        function toggleComplete(id) {
            if (completedSessions.has(id)) {
                completedSessions.delete(id);
            } else {
                completedSessions.add(id);
                
                // Fancy confetti effect via minimal JS creation could go here
                // For now, just save and re-render
            }
            saveProgress();
            updateGlobalProgress();
            
            // Re-render current view to show changes
            if (activeSessionId === id) {
                renderSession(id);
            } else {
                renderHome(); // Should not happen if button is inside session view, but good safety
            }
        }

        // Progress Logic
        function updateGlobalProgress() {
            const completed = completedSessions.size;
            const total = courseData.length;
            const percentage = (completed / total) * 100;
            
            progressBar.style.width = `${percentage}%`;
        }

        function saveProgress() {
            localStorage.setItem('msmk_ml_progress', JSON.stringify(Array.from(completedSessions)));
        }

        function loadProgress() {
            const saved = localStorage.getItem('msmk_ml_progress');
            if (saved) {
                completedSessions = new Set(JSON.parse(saved));
            }
            updateGlobalProgress();
            renderSidebar(); // Update checkmarks in sidebar
        }

        // Start app
        init();

    </script>
</body>
</html>
