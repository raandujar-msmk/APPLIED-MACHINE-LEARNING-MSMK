<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Enlace</title>
    <!-- Carga de Tailwind CSS para un diseño moderno y responsive -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Asegura que el cuerpo ocupe toda la altura de la ventana */
        html, body {
            height: 100%;
        }
        /* Estilos de fondo oscuro y centrado */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1f2937; /* Fondo muy oscuro */
            display: flex;
            justify-content: center; /* Centrado horizontal */
            align-items: center; /* Centrado vertical */
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>

    <!-- Panel Central Único con Fondo Oscuro y Texto Blanco -->
    <div class="bg-gray-800 p-12 md:p-16 rounded-2xl shadow-2xl text-center border border-gray-700 max-w-sm md:max-w-xl mx-4">
        
        <!-- El enlace en sí, con un color que resalta y monospace para claridad -->
        <a href="https://datavizcatalogue.com/" target="_blank" 
           class="text-2xl sm:text-3xl font-mono text-indigo-400 hover:text-indigo-300 transition duration-300 underline break-words">
            https://datavizcatalogue.com/
        </a>
        
    </div>

</body>
</html>
